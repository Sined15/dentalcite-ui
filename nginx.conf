server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Enrutado del lado del cliente: recargar /usuarios o entrar directo a
    # /bloqueos/nuevo debe devolver index.html, no un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los artefactos llevan hash en el nombre, asi que se pueden cachear
    # indefinidamente; index.html no, o el navegador serviria una version vieja.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
